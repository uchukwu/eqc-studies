[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-optical-qc"
version = "0.1.0"
description = "Research toolkit for entropy-driven all-optical quantum computing"
authors = [{ name = "Entropy Quantum Computing Team" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "qutip>=5.0.0",  # for Lindblad solvers
    "jax>=0.4",      # for differentiable control (optional)
]

[project.optional-dependencies]
testing = ["pytest>=7.4", "hypothesis>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
